<h2 class="title mb-3">Analítica</h2>

<p>Añadir solo valores fuera de rango.</p>
<!-- SCROLL INTERNO -->
<div class="labs-scroll">
  <form [formGroup]="form" class="labs-grid" aria-label="Formulario de analítica">

    <!-- Función renal -->
    <mat-form-field appearance="outline">
      <mat-label>eGFR (ml/min/1.73m²)</mat-label>
      <input matInput type="number" formControlName="egfr_ml_min_173" placeholder="p. ej. 85" />
    </mat-form-field>

    <!-- Signos vitales cardíacos -->
    <mat-form-field appearance="outline">
      <mat-label>Frecuencia Cardíaca (lpm)</mat-label>
      <input matInput type="number" formControlName="fc_lpm" placeholder="p. ej. 72" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Intervalo QTc (ms)</mat-label>
      <input matInput type="number" formControlName="qtc_ms" placeholder="p. ej. 420" />
    </mat-form-field>

    <!-- Electrolitos -->
    <mat-form-field appearance="outline">
      <mat-label>Potasio sérico (mmol/L)</mat-label>
      <input matInput type="number" formControlName="potasio_mmol_l" placeholder="p. ej. 4.5" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Sodio sérico (mmol/L)</mat-label>
      <input matInput type="number" formControlName="sodio_mmol_l" placeholder="p. ej. 140" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Calcio corregido (mmol/L)</mat-label>
      <input matInput type="number" formControlName="calcio_corregido_mmol_l" placeholder="p. ej. 2.4" />
    </mat-form-field>

    <!-- Presión arterial -->
    <mat-form-field appearance="outline">
      <mat-label>Presión Arterial Sistólica (mmHg)</mat-label>
      <input matInput type="number" formControlName="pas_mmhg" placeholder="p. ej. 120" />
    </mat-form-field>
  </form>

  <!-- BARRA DE ACCIONES STICKY -->
  <div class="actions">
    <button mat-stroked-button class="btn-ghost" (click)="goPrev()">Atrás</button>
    <button mat-flat-button color="primary" (click)="goNext()">Siguiente</button>
  </div>
</div>
