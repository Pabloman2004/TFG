<div class="results-container">
  <h2 class="mb-3">Resultados STOPP/START</h2>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar criterio</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Ej. metformina, IECA..." />
  </mat-form-field>

  <div class="scroll-container">
    <mat-accordion multi class="accordion-container">
      @for (system of getActiveSystems(); track system) {
        @let items = getBySystem(system);
      <mat-expansion-panel>
        <mat-expansion-panel-header>
          <mat-panel-title>
            {{ system }} ({{ items.length }})
          </mat-panel-title>
        </mat-expansion-panel-header>

        <div class="criterios">
          @for (c of items; track c.id) {
          <mat-card class="criterio-card" [ngClass]="c.type.toLowerCase()">
            <div class="flex justify-between items-center">
              <div>
                <mat-chip-listbox class="tipo-chip">
                  @if (c.type === 'STOPP') {
                  <mat-chip color="warn">STOPP</mat-chip>
                  }
                  @if (c.type === 'START') {
                  <mat-chip color="primary">START</mat-chip>
                  }
                </mat-chip-listbox>
                <h3 class="m-0">{{ c.id }}</h3>
                <p class="m-0 muted">{{ c.summary }}</p>
              </div>
            </div>
          </mat-card>
          }
        </div>
      </mat-expansion-panel>
      }
    </mat-accordion>

    <!--  Botones dentro del scroll-container -->
    <div class="buttons-container">
      <button mat-stroked-button (click)="navigateBack()">Atrás</button>
      <button mat-stroked-button color="accent"
              (click)="saveToHistory()"
              [disabled]="caseSaved() || !store.patient()">
        <mat-icon>bookmark_add</mat-icon>
        {{ caseSaved() ? 'Guardado' : 'Guardar en historial' }}
      </button>
      <button mat-flat-button color="primary" (click)="onExportPdf()">Exportar PDF</button>
    </div>
  </div>
</div>
